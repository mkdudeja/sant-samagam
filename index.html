<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>%VITE_APP_NAME% | %VITE_EVENT_NAME%</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- applies the saved theme before first paint, so dark mode never flashes white -->
    <script>
      // mirrors getStoredTheme()/getDeviceTheme() in src/app/shared/use-theme.ts
      try {
        var stored = localStorage.getItem("eDirectory_theme")
        var isDark =
          stored === "dark" || stored === "light"
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches
        if (isDark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#fbf8f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <link
      rel="apple-touch-icon"
      href="/assets/images/icons/apple-touch-icon-180x180.png"
    />

    <!-- iOS splash screens (generated by `npm run generate-pwa-assets`;
         light and dark variants, one per device size) -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-1170x2532.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-828x1792.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-light-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/assets/images/splash/apple-splash-portrait-dark-750x1334.png"
    />

    <!-- Viewport for proper mobile rendering -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <style>
      /* Pre-React loading screen. Inlined because the bundled CSS has not
         loaded yet at first paint; removed by an effect in app.component.tsx. */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        background: #fbf8f2;
      }
      #app-loading img {
        width: min(62vw, 260px);
        height: auto;
        border-radius: 18px;
      }
      #app-loading .bar {
        width: min(52vw, 200px);
        height: 3px;
        border-radius: 999px;
        background: rgba(31, 59, 107, 0.15);
        overflow: hidden;
      }
      #app-loading .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #1f3b6b;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-loading-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      /* dark: keep the logo on its own light card so it stays legible */
      html.dark #app-loading {
        background: #111827;
      }
      html.dark #app-loading img {
        background: #fbf8f2;
      }
      html.dark #app-loading .bar {
        background: rgba(255, 255, 255, 0.18);
      }
      html.dark #app-loading .bar > i {
        background: #e2ebf7;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .bar > i {
          animation: none;
          width: 100%;
        }
      }
      @media print {
        #app-loading {
          display: none !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="app-loading" role="status" aria-label="Loading eDirectory">
      <img
        src="/assets/images/icons/pwa-512x512.png"
        alt=""
        width="512"
        height="512"
      />
      <span class="bar"><i></i></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
