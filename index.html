<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>%VITE_APP_NAME% | %VITE_EVENT_NAME%</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- applies the saved theme before first paint, so dark mode never flashes white -->
    <script>
      // mirrors getStoredTheme()/getDeviceTheme() in src/app/shared/use-theme.ts
      try {
        var stored = localStorage.getItem("eDirectory_theme")
        var isDark =
          stored === "dark" || stored === "light"
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches
        if (isDark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#87CEEB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Splash screen for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="apple-touch-startup-image"
      href="/apple-touch-icon-180x180.png"
    />

    <!-- Viewport for proper mobile rendering -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
